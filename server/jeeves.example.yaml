# Copy to jeeves.yaml and edit.
timezone: Europe/London

# Claude settings. Effort trades depth for cost; "low" is plenty for chore planning.
model: claude-opus-5-5
effort: low
max_runs_per_day: 20

about_me: |
  I work from home on weekdays and usually have a free hour after 18:00.
  I'd rather do quick wins first.

# Plugins are separate services that speak MCP over HTTP.
plugins:
  - name: todo
    url: http://todo:8081/mcp
    token_env: TODO_PLUGIN_TOKEN
todo_plugin: todo

rules:
  # The worked example: back home after being out for a while, in the evening.
  - id: arrive-home
    description: Evening plan when I get home
    event: wifi.connected
    when:
      ssid: MyHomeWiFi
      after: "17:00"
      before: "22:30"
      min_away_minutes: 120
    cooldown: daily
    action:
      type: plan
      prompt: I've just got home. Send me tonight's to-do list, easiest first.

  # The "Plan my day" button in the app.
  - id: manual-plan
    event: manual.plan
    cooldown: 5
    action:
      type: plan
      prompt: I've asked for a plan now. Send me what's due, easiest first.

  # A morning heads-up at weekends.
  - id: weekend-morning
    schedule: "0 9 * * sat,sun"
    cooldown: daily
    action:
      type: plan
      prompt: Good morning. Give me a short heads-up of today's chores, easiest first.
