name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [server, plugins/todo]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm ci
        # server's e2e test and test server import the to-do plugin's sources
        if: matrix.package == 'server'
        working-directory: plugins/todo
      - run: npm test
        env:
          NODE_ENV: test

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  web-e2e:
    name: Web UI smoke test (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            plugins/todo/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: plugins/todo
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  docker:
    name: Server image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile .

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish to the android-latest release
    # Publishes from main go one at a time, so the release never moves back to an older build.
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: android
    env:
      # Becomes versionCode (and versionName 0.1.<n>), see android/app/build.gradle.kts.
      JEEVES_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jeeves-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # The app's updater reads version.json from this release and installs the APK it names.
      # Order matters: upload the new APK, then version.json, then delete older APKs, so
      # version.json never names a file that isn't there.
      - name: Publish to the android-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-latest
        run: |
          apk="jeeves-$JEEVES_VERSION_CODE.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          notes=$(git log -1 --format=%s)
          # A merge commit's subject is "Merge pull request #n from ..."; its body holds the PR title.
          case "$notes" in "Merge pull request"*) notes=$(git log -1 --format=%b | head -n 1) ;; esac
          jq -n \
            --argjson versionCode "$JEEVES_VERSION_CODE" \
            --arg versionName "0.1.$JEEVES_VERSION_CODE" \
            --arg apk "$apk" \
            --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" \
            --arg commit "$GITHUB_SHA" \
            --arg notes "$notes" \
            '$ARGS.named' > version.json
          cat version.json

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Android (rolling)" --notes "Latest Android build from main. The app updates itself from here."
          fi
          gh release upload "$TAG" "$apk" --clobber
          gh release upload "$TAG" version.json --clobber
          for old in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '^jeeves-[0-9]+\.apk$' | grep -vx "$apk"); do
            gh release delete-asset "$TAG" "$old" --yes
          done
          # Keep the tag on the commit that was built.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
