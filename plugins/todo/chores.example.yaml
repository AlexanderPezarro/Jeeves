# Seed/import file. Copy to chores.yaml and edit before the first start; after that, manage chores
# in the Chores page (Jeeves > Plugins > Chores). On start, and when you press "Import from
# chores.yaml" there, only chores whose id is not already in the database are added: once a chore
# is in the database it is never overwritten from this file, and chores deleted in the UI are not
# brought back. Renaming an id here therefore adds a new chore.
#
# recurrence:
#   { every: day }
#   { every: week, on: [mon, thu] }
#   { every: month, day: 1 }
#   { every: days, interval: 3, start: 2026-11-01 }
# effort: 1 (trivial) to 5 (hard). The planner puts the easiest first.
# completion_mode: reply (tap Done), sensor (smart plug, later).
# Timed chores like laundry (nudge until started, then until done) are workflows now: see
# config.example/workflows/laundry.yaml in the Jeeves repo.

chores:
  - id: dishes
    name: Wash the dishes
    recurrence: { every: day }
    effort: 1
    est_minutes: 10
    how_to:
      - Clear the sink and stack plates by size
      - Hot soapy water, glasses first, pans last
      - Leave pans to drain, wipe the counter

  - id: laundry
    name: Do a load of laundry
    recurrence: { every: week, on: [wed, sun] }
    effort: 2
    est_minutes: 15
    how_to:
      - Sort darks and lights, check pockets
      - 40 degree cycle, one pod in the drum
      - Tap Start when the machine is running

  - id: bins
    name: Take the bins out
    recurrence: { every: week, on: [mon] }
    effort: 1
    est_minutes: 5
    how_to:
      - Tie the kitchen bag and recycling
      - Wheel the bin to the kerb

  - id: hoover
    name: Hoover the flat
    recurrence: { every: week, on: [sat] }
    effort: 3
    est_minutes: 25
    how_to:
      - Pick things up off the floor first
      - Bedroom, then living room, then hallway
      - Empty the hoover when you finish

  - id: run
    name: Go for a run
    recurrence: { every: week, on: [tue, thu, sat] }
    effort: 4
    est_minutes: 40
    goal: Run 3 times a week
    how_to:
      - Kit on before you think about it
      - Easy 5k, conversational pace
