# Answers what you write in the app's chat. Each message arrives as a message.received event
# ({{event.text}}); change the prompt to change how Jeeves replies, or add conditions to route
# some messages elsewhere. It is offered every plugin's tools, so approving a meal plan in chat works here.
id: chat-reply
description: Answer my chat messages
cooldown: 0
triggers:
  - event: message.received
steps:
  - id: reply
    claude:
      prompt: |
        I wrote to you: "{{event.text}}"
        Work out what I mean and make any changes with the plugin tools (for example, mark the
        tasks I mention as done), then reply once with send_message, briefly.
        If I'm approving or changing a dinner plan, save it with the meals tools (set_plan, then
        create_shop) after checking it with preview_plan.
      # Shows Claude the whole conversation so far, so follow-ups like "and the bins" make sense.
      history: true
