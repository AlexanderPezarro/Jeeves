# Jeeves: control server + to-do and calendar plugins.
# Put your settings in config/ (copy config.example/), plugins/todo/chores.yaml and .env (see the *.example files).
services:
  server:
    # Built from the repo root so the image also contains the web UI (web/ -> /admin).
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/London
      # config/ holds jeeves.yaml, workflows/ and plugins/. Mounted read-write: the server migrates
      # old rules into workflows/ and the web UI edits these files. Must be writable by uid 1000.
      JEEVES_CONFIG_DIR: /config
      JEEVES_DB_PATH: /data/jeeves.db
      # "cli" (default) drives Claude with your subscription: CLAUDE_CODE_OAUTH_TOKEN from .env
      # (`claude setup-token`), else the Claude Code login mounted below. "api" uses ANTHROPIC_API_KEY.
      JEEVES_CLAUDE_BACKEND: ${JEEVES_CLAUDE_BACKEND:-cli}
      # Web UI auth: trust Authelia's Remote-User on /admin/api, but only from Caddy's address
      # (set JEEVES_TRUSTED_PROXY in .env). Off unless both are set.
      JEEVES_TRUST_PROXY_AUTH: ${JEEVES_TRUST_PROXY_AUTH:-0}
      JEEVES_TRUSTED_PROXY: ${JEEVES_TRUSTED_PROXY:-}
      # Optional "from=to": post pushes to ntfy over the compose network instead of its public name,
      # e.g. https://ntfy.alexanderpezarro.uk=http://ntfy:80 (the name only resolves to a Tailscale IP).
      PUSH_ENDPOINT_REWRITE: ${PUSH_ENDPOINT_REWRITE:-}
    volumes:
      - ./config:/config
      - jeeves-data:/data
      # Fallback when CLAUDE_CODE_OAUTH_TOKEN is unset: the host's Claude Code login. These sessions
      # hit a time limit and can't be renewed unattended, so prefer the token. Container user is uid 1000.
      - ${CLAUDE_HOME:-~/.claude}:/home/node/.claude
      # Push: UnifiedPush through the ntfy service below. See "Push (ntfy + UnifiedPush)" in docs/deploy.md.
      # (The old FCM path still works: mount ./firebase.json and set FIREBASE_SERVICE_ACCOUNT in .env.)
    ports:
      # Caddy reaches the server over proxy_network, so set JEEVES_BIND=127.0.0.1 in .env to keep
      # this port off the LAN (recommended once the web UI is on, see docs/deploy.md).
      - "${JEEVES_BIND:-0.0.0.0}:${JEEVES_PORT:-8080}:8080"
    depends_on:
      - todo
      - calendar
    networks:
      - default
      # Caddy (~/projects/proxy) serves it at https://jeeves.alexanderpezarro.uk, Tailscale-only.
      - proxy_network

  todo:
    build: ./plugins/todo
    restart: unless-stopped
    environment:
      TZ: Europe/London
      TODO_PLUGIN_TOKEN: ${TODO_PLUGIN_TOKEN}
      TODO_DB_PATH: /data/todo.db
      TODO_CHORES_FILE: /config/chores.yaml
      # Task events (todo.task_started / todo.task_completed) go to <JEEVES_URL>/plugin-events.
      JEEVES_URL: http://server:8080
    volumes:
      # Seed/import only: new ids are added on start and by "Import from chores.yaml" on the Chores page.
      # Chores already in todo.db are never overwritten from this file; edit them in the Chores page.
      - ./plugins/todo/chores.yaml:/config/chores.yaml:ro
      - todo-data:/data
    # Not published: only the server talks to the plugin, over the compose network.

  calendar:
    build: ./plugins/calendar
    restart: unless-stopped
    environment:
      TZ: Europe/London
      CALENDAR_PLUGIN_TOKEN: ${CALENDAR_PLUGIN_TOKEN}
    # Read-only, keeps nothing on disk and is not published: only the server talks to it, over the
    # compose network. It needs outbound internet to fetch the Google Calendar iCal feed. The feed
    # address is a secret (config/plugins/calendar.yaml -> CALENDAR_ICAL_URL in .env) and is pushed
    # to it by the server.

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    restart: unless-stopped
    environment:
      TZ: Europe/London
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
    # No ports: Caddy reaches it as jeeves-ntfy-1:80 over proxy_network (Tailscale-only, own ACL,
    # no Authelia), and the Jeeves server posts to it over the default network.
    networks:
      - default
      - proxy_network

networks:
  proxy_network:
    external: true

volumes:
  jeeves-data:
  todo-data:
  ntfy-cache:
  ntfy-auth:
